<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Results — Harbor Flights 🐙✈️</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #3b82f6; --accent-dim: #2563eb; --accent-glow: rgba(59,130,246,0.15);
      --bg: #0a0a0a; --bg-card: #141414; --bg-card-hover: #1a1a1a;
      --border: #222; --text: #e5e5e5; --text-dim: #888; --text-bright: #fff;
      --green: #22c55e; --red: #ef4444; --orange: #f59e0b;
    }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .header { padding: 40px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-bright); }
    .header h1 .accent { color: var(--accent); }
    .header .route { font-size: 2rem; font-weight: 800; color: var(--text-bright); margin: 8px 0; }
    .header .meta { color: var(--text-dim); font-size: 0.9rem; display: flex; gap: 16px; flex-wrap: wrap; }
    .header .meta span { display: flex; align-items: center; gap: 4px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { text-decoration: underline; }

    /* Status bar */
    .status-bar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.loading { background: var(--orange); animation: pulse 1.5s infinite; }
    .status-dot.done { background: var(--green); }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { flex: 1; font-size: 0.85rem; color: var(--text-dim); }

    /* Controls */
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .controls select, .controls button {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    }
    .controls select:hover, .controls button:hover { border-color: var(--accent); }
    .controls label { font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .result-count { margin-left: auto; color: var(--text-dim); font-size: 0.85rem; }

    /* Results */
    .results { display: flex; flex-direction: column; gap: 12px; }
    .result-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; transition: border-color 0.2s;
    }
    .result-card:hover { border-color: #333; }
    .result-card.hot { border-left: 3px solid var(--red); }
    .result-card.good { border-left: 3px solid var(--green); }
    .result-card.fair { border-left: 3px solid var(--orange); }

    .result-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .result-airline { font-weight: 700; font-size: 1.1rem; color: var(--text-bright); }
    .result-badge { font-size: 0.75rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .result-badge.hot { background: rgba(239,68,68,0.15); color: var(--red); }
    .result-badge.good { background: rgba(34,197,94,0.15); color: var(--green); }
    .result-badge.fair { background: rgba(245,158,11,0.15); color: var(--orange); }

    .result-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .result-detail label { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .result-detail .value { font-weight: 600; color: var(--text-bright); font-size: 0.95rem; }
    .result-detail .value.pts { color: var(--accent); }
    .result-detail .value.cpp { font-size: 1.1rem; }

    .result-transfer {
      background: var(--accent-glow); border: 1px solid rgba(59,130,246,0.2); border-radius: 6px;
      padding: 8px 12px; font-size: 0.85rem; color: var(--accent); margin-bottom: 12px;
    }
    .result-actions { display: flex; gap: 8px; }
    .result-actions a {
      background: var(--accent); color: #fff; text-decoration: none; padding: 8px 16px;
      border-radius: 6px; font-size: 0.85rem; font-weight: 600; transition: background 0.2s;
    }
    .result-actions a:hover { background: var(--accent-dim); }
    .result-actions a.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .result-actions a.secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Empty state */
    .empty { text-align: center; padding: 80px 20px; }
    .empty .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty h3 { color: var(--text-bright); margin-bottom: 8px; }
    .empty p { color: var(--text-dim); max-width: 400px; margin: 0 auto; }

    /* No API key warning */
    .warning-box { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .warning-box h4 { color: var(--orange); margin-bottom: 4px; }
    .warning-box p { color: var(--text-dim); font-size: 0.85rem; }
    .warning-box code { background: var(--bg); padding: 2px 6px; border-radius: 3px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/flights" class="back-link">← Back to Harbor Flights</a>
      <h1>🐙✈️ Harbor <span class="accent">Flights</span></h1>
      <div class="route" id="routeDisplay">Loading...</div>
      <div class="meta" id="metaDisplay"></div>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-dot loading" id="statusDot"></div>
      <div class="status-text" id="statusText">Searching for award availability...</div>
    </div>

    <div id="warningBox" style="display:none" class="warning-box">
      <h4>⚠️ No seats.aero API Key</h4>
      <p>To get real award flight data, add your seats.aero Pro API key ($9.99/mo) to <code>.env</code>:<br>
      <code>SEATS_AERO_API_KEY=pro_your_key_here</code></p>
    </div>

    <div class="controls" id="controls" style="display:none">
      <select id="sortBy">
        <option value="cpp">Sort: Best Value (CPP)</option>
        <option value="points">Sort: Lowest Points</option>
        <option value="date">Sort: Date</option>
      </select>
      <select id="cabinFilter">
        <option value="all">All Cabins</option>
        <option value="first">First Class</option>
        <option value="business">Business</option>
        <option value="premium_economy">Premium Economy</option>
        <option value="economy">Economy</option>
      </select>
      <label><input type="checkbox" id="directOnly"> Direct only</label>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || 'JFK';
    const to = params.get('to') || 'NRT';
    const cabin = params.get('class') || 'any';
    const program = params.get('program') || 'amex-mr';

    document.getElementById('routeDisplay').textContent = `${from} → ${to}`;
    document.getElementById('metaDisplay').innerHTML = `
      <span>🪑 ${cabin === 'any' ? 'Any Cabin' : cabin.charAt(0).toUpperCase() + cabin.slice(1)}</span>
      <span>💳 ${program.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
    `;

    let allResults = [];

    async function search() {
      try {
        const resp = await fetch(`/api/flights/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&class=${encodeURIComponent(cabin)}&program=${encodeURIComponent(program)}`);
        const data = await resp.json();

        if (data.warning) {
          document.getElementById('warningBox').style.display = 'block';
        }

        allResults = data.results || [];
        document.getElementById('statusDot').className = 'status-dot done';
        document.getElementById('statusText').textContent = 
          `Found ${allResults.length} result(s) • Source: ${data.source || 'seats.aero'} • Last updated: ${new Date().toLocaleTimeString()}`;
        
        if (allResults.length > 0) {
          document.getElementById('controls').style.display = 'flex';
        }
        renderResults();
      } catch (err) {
        document.getElementById('statusDot').className = 'status-dot error';
        document.getElementById('statusText').textContent = `Error: ${err.message}`;
      }
    }

    function renderResults() {
      const sort = document.getElementById('sortBy').value;
      const cabinF = document.getElementById('cabinFilter').value;
      const directOnly = document.getElementById('directOnly').checked;

      let filtered = [...allResults];
      if (cabinF !== 'all') filtered = filtered.filter(r => r.cabin === cabinF);
      if (directOnly) filtered = filtered.filter(r => r.direct);

      if (sort === 'cpp') filtered.sort((a, b) => (b.cpp || 0) - (a.cpp || 0));
      else if (sort === 'points') filtered.sort((a, b) => a.points - b.points);
      else if (sort === 'date') filtered.sort((a, b) => a.departureDate.localeCompare(b.departureDate));

      document.getElementById('resultCount').textContent = `${filtered.length} result(s)`;

      if (filtered.length === 0) {
        document.getElementById('results').innerHTML = `
          <div class="empty">
            <div class="icon">🔍</div>
            <h3>No results found</h3>
            <p>${allResults.length === 0 
              ? 'No award availability found for this route. This could mean no seats.aero API key is configured, or there\'s simply no availability right now.' 
              : 'No results match your current filters. Try adjusting cabin or direct-only filter.'}</p>
          </div>`;
        return;
      }

      document.getElementById('results').innerHTML = filtered.map(r => {
        const ratingEmoji = r.dealRating === 'hot' ? '🔥' : r.dealRating === 'good' ? '✅' : '⚠️';
        const ratingLabel = r.dealRating === 'hot' ? 'Hot Deal' : r.dealRating === 'good' ? 'Good Value' : 'Fair';
        return `
          <div class="result-card ${r.dealRating}">
            <div class="result-top">
              <div>
                <span class="result-airline">${r.airline} ${r.cabinDisplay}</span>
                ${r.flightNumber ? `<span style="color:var(--text-dim);font-size:0.85rem;margin-left:8px">${r.flightNumber}</span>` : ''}
              </div>
              <span class="result-badge ${r.dealRating}">${ratingEmoji} ${ratingLabel}</span>
            </div>
            <div class="result-details">
              <div class="result-detail">
                <label>Date</label>
                <div class="value">${r.departureDate}</div>
              </div>
              <div class="result-detail">
                <label>Route</label>
                <div class="value">${r.route} ${r.direct ? '✈️ Direct' : r.stops > 0 ? `(${r.stops} stop)` : ''}</div>
              </div>
              <div class="result-detail">
                <label>Points Required</label>
                <div class="value pts">${r.points.toLocaleString()} pts</div>
              </div>
              <div class="result-detail">
                <label>Taxes/Fees</label>
                <div class="value">$${(r.taxes || 0).toFixed(0)}</div>
              </div>
              <div class="result-detail">
                <label>Cash Price Est.</label>
                <div class="value">${r.cashPrice ? '$' + r.cashPrice.toLocaleString() : '—'}</div>
              </div>
              <div class="result-detail">
                <label>Value (CPP)</label>
                <div class="value cpp">${r.cpp ? r.cpp + '¢' : '—'}</div>
              </div>
            </div>
            <div class="result-transfer">${r.transferPath}</div>
            <div class="result-actions">
              ${r.bookingUrl ? `<a href="${r.bookingUrl}" target="_blank">Book Now →</a>` : ''}
              <a href="https://seats.aero/" target="_blank" class="secondary">View on seats.aero</a>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('sortBy').addEventListener('change', renderResults);
    document.getElementById('cabinFilter').addEventListener('change', renderResults);
    document.getElementById('directOnly').addEventListener('change', renderResults);

    search();
  </script>
</body>
</html>
